name: outcome evals post
# Posts or updates the one outcome-evals comment on a PR for a finished eval run. Callers: outcome-evals-pr.yml
# (same-repository PRs), outcome-evals-comment.yml (fork PRs, via workflow_run) and web-preview.yml (post-merge).
# Trust: the run's results.json may come from fork code, so this job never runs code from the run and never posts
# markdown from it. It checks out this workflow's own commit (the default branch under workflow_run), validates
# results.json strictly and renders the comment with web/evals/pr-comment.mjs. The tested commit and time come from
# the run's own metadata in the GitHub API, never from the artifact.
# One concurrency group per resolved PR serialises every write, and a write from a run that started earlier than the
# run the comment already shows is refused, so an older run can never overwrite a newer scorecard.
on:
  workflow_call:
    inputs:
      run_id:
        description: Workflow run that uploaded the outcome-evals-results artifact
        required: true
        type: string
      lookup:
        description: "'head' (the run tested a PR head) or 'merge' (the run tested a PR's merge commit)"
        required: true
        type: string
      kind:
        description: "'pr' (the PR's build, served in the runner) or 'deployed' (a deployed preview)"
        required: true
        type: string
      live_url:
        description: Live app the run's live journey used, if any
        required: false
        type: string
        default: ''
permissions:
  actions: read # run metadata and the results artifact
  pull-requests: write # the one outcome-evals comment
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.meta.outputs.pr }}
      sha: ${{ steps.meta.outputs.sha }}
      created_at: ${{ steps.meta.outputs.created_at }}
    steps:
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          LOOKUP: ${{ inputs.lookup }}
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .head_sha)
          created_at=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .run_started_at)
          if [ "$LOOKUP" = head ]; then
            pr=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq ".[] | select(.head.sha == \"$sha\") | .number" | head -n1)
          else
            pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" --jq '.[0].number // empty')
          fi
          { echo "sha=$sha"; echo "created_at=$created_at"; echo "pr=$pr"; } >> "$GITHUB_OUTPUT"
          echo "Run $RUN_ID tested $sha, started $created_at; PR: ${pr:-none}"
  post:
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    runs-on: ubuntu-latest
    concurrency:
      group: outcome-evals-comment-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: web/evals
      # actions/download-artifact v4.3.0, pinned to its tag commit.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: outcome-evals-results
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/results
      - name: Render (validated) and post, refusing stale writes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.resolve.outputs.pr }}
          SHA: ${{ needs.resolve.outputs.sha }}
          OURS: ${{ needs.resolve.outputs.created_at }}
          KIND: ${{ inputs.kind }}
          LIVE_URL: ${{ inputs.live_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.run_id }}
        run: |
          node web/evals/pr-comment.mjs --results "$RUNNER_TEMP/results/results.json" --kind "$KIND" --sha "$SHA" --tested-at "$OURS" --run-url "$RUN_URL" ${LIVE_URL:+--live-url "$LIVE_URL"} > "$RUNNER_TEMP/body.md"
          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- outcome-evals -->"))) | [.id, (.body | capture("tested_at=(?<t>[^ ]+) ").t // "")] | @tsv' | tail -n1)
          id=$(printf '%s' "$existing" | cut -f1)
          theirs=$(printf '%s' "$existing" | cut -f2)
          if [ -n "$theirs" ] && [[ "$theirs" > "$OURS" ]]; then
            echo "The comment shows a run that started later ($theirs) than this one ($OURS); not overwriting."
            exit 0
          fi
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@"$RUNNER_TEMP/body.md" > /dev/null && echo "Updated comment $id on PR #$PR"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@"$RUNNER_TEMP/body.md" > /dev/null && echo "Posted a comment on PR #$PR"
          fi
