name: web deploy
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write # post the registry proof to issue #4
concurrency:
  group: web-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/worker/package-lock.json
      - run: npm ci
      - run: npm ci --prefix worker # Worker-only deps (Solana SDK), own lockfile
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      # Worker secrets (backend map G-SAS, G-RPC). REGISTRAR_KEY comes from the SPIKE_KEYS repo secret
      # (devnet only). SELFTEST_TOKEN is new on every run and only this job knows it. RPC_URL uses the
      # optional DEVNET_RPC_URL repo secret, else the public devnet endpoint.
      - name: Prepare Worker secrets
        env:
          SPIKE_KEYS: ${{ secrets.SPIKE_KEYS }}
          DEVNET_RPC_URL: ${{ secrets.DEVNET_RPC_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          test -n "$SPIKE_KEYS" || { echo "MISSING: SPIKE_KEYS"; exit 1; }
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          echo "SELFTEST_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          SELFTEST_TOKEN="$TOKEN" node -e '
            const k = JSON.parse(process.env.SPIKE_KEYS);
            const out = { REGISTRAR_KEY: JSON.stringify(k.registrar), SELFTEST_TOKEN: process.env.SELFTEST_TOKEN,
              RPC_URL: process.env.DEVNET_RPC_URL || "https://api.devnet.solana.com",
              // S1-S4 product API: Supabase (auth check + data) and the LLM gateway.
              SUPABASE_URL: process.env.SUPABASE_URL || "", SUPABASE_PUBLISHABLE_KEY: process.env.SUPABASE_PUBLISHABLE_KEY || "",
              SUPABASE_SECRET_KEY: process.env.SUPABASE_SECRET_KEY || "", OPENROUTER_API_KEY: process.env.OPENROUTER_API_KEY || "",
              OPENROUTER_MODEL: process.env.OPENROUTER_MODEL || "openrouter/auto" };
            for (const k of Object.keys(out)) if (!out[k]) { delete out[k]; console.log("not set: " + k); }
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/worker-secrets.json", JSON.stringify(out), { mode: 0o600 });'
      - name: Deploy to Cloudflare (jamjam.tech)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"
      - name: Remove the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
      - name: Install Chromium for the deployed check
        run: npx --yes playwright@$(node -p "require('playwright-core/package.json').version") install --with-deps chromium
      - name: Check the deployed site
        env:
          BASE_URL: https://jamjam.tech
        run: node scripts/check-deployed.mjs
      - name: Check the registry (S0 done-when 3)
        env:
          BASE_URL: https://jamjam.tech
          EXPECTED_REGISTRAR: E6nY1Wzgish68uZNeJDJKk2wAUWmYwG8yXSZeTSuDvMG
          SPIKE_KEYS: ${{ secrets.SPIKE_KEYS }}
        run: |
          export REGISTRAR_KEY=$(node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.env.SPIKE_KEYS).registrar))')
          node worker/check-registry.mjs
      - name: Post the registry proof to issue 4
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f proof/deployed-registry.txt || exit 0
          { echo "S0 done-when (3), registry proof from the deploy run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (commit ${{ github.sha }}):"; echo; echo '```'; cat proof/deployed-registry.txt; echo '```'; } > "$RUNNER_TEMP/comment.md"
          gh issue comment 4 --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/comment.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-check
          path: web/proof/deployed-*
          if-no-files-found: ignore
