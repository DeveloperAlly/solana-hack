name: web deploy
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Deploy to Cloudflare (jamjam.tech)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Install Chromium for the deployed check
        run: npx --yes playwright@$(node -p "require('playwright-core/package.json').version") install --with-deps chromium
      - name: Check the deployed site
        env:
          BASE_URL: https://jamjam.tech
        run: node scripts/check-deployed.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-check
          path: web/proof/deployed-*
          if-no-files-found: ignore
