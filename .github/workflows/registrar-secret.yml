# One-off (owner go-ahead 2026-10-07, recorded at https://github.com/DeveloperAlly/solana-hack/issues/4#issuecomment-6039702428): make the funded devnet Registrar from the spike
# (funded in devnet-spike run 4, commit 43b8634) the Worker's Registrar.
# Copies SPIKE_KEYS.registrar into the waterlily Worker secret REGISTRAR_KEY. Logs only the public address.
name: registrar secret
on:
  push:
    branches: [main]
    paths: ['.github/workflows/registrar-secret.yml']
  workflow_dispatch:
permissions:
  contents: read
# Same group as web-deploy.yml: this merge also triggers a deploy (web/** changes), and both mutate the Worker,
# so they run one after the other instead of overlapping.
concurrency:
  group: web-deploy
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Copy the Registrar key into the Worker secret
        env:
          SPIKE_KEYS: ${{ secrets.SPIKE_KEYS }}
          EXPECTED_ADDRESS: E6nY1Wzgish68uZNeJDJKk2wAUWmYwG8yXSZeTSuDvMG
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/registrar-to-worker.mjs
