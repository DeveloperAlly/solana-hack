# One-off (owner go-ahead 2026-10-07, recorded at https://github.com/DeveloperAlly/solana-hack/issues/4#issuecomment-6039702428): make the funded devnet Registrar from the spike
# (funded in devnet-spike run 4, commit 43b8634) the Worker's Registrar.
# Copies SPIKE_KEYS.registrar into the waterlily Worker secret REGISTRAR_KEY. Logs only the public address.
name: registrar secret
on:
  push:
    branches: [main]
    paths: ['.github/workflows/registrar-secret.yml', 'ops/registrar-to-worker.mjs']
  workflow_dispatch:
permissions:
  contents: read
# Same group as web-deploy.yml so a secret write never overlaps a deploy. This PR touches nothing under web/,
# so merging it does not start a deploy, and this run is never left pending behind one.
concurrency:
  group: web-deploy
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Copy the Registrar key into the Worker secret
        env:
          SPIKE_KEYS: ${{ secrets.SPIKE_KEYS }}
          EXPECTED_ADDRESS: E6nY1Wzgish68uZNeJDJKk2wAUWmYwG8yXSZeTSuDvMG
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: node ops/registrar-to-worker.mjs
