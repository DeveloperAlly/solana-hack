<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>JamJam</title>
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: none; stroke: #000000; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #000000; }
      .ink { stroke: #ffffff; }
    }
  </style>
  <rect class="bg" width="64" height="64"/>
  <g class="ink">
    <rect x="5" y="5" width="54" height="54" stroke-width="6"/>
    <line x1="5" y1="5" x2="59" y2="59" stroke-width="4"/>
    <line x1="59" y1="5" x2="5" y2="59" stroke-width="4"/>
  </g>
</svg>
